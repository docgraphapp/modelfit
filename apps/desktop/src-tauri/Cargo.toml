[package]
name = "mmf-desktop"
version.workspace = true
license.workspace = true
edition.workspace = true

[lib]
name = "mmf_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
log = "0.4"
mmf-hardware = { path = "../../../crates/hardware" }
mmf-registry = { path = "../../../crates/registry" }
mmf-recommendation = { path = "../../../crates/recommendation" }
mmf-runtime-adapters = { path = "../../../crates/runtime-adapters" }
mmf-share = { path = "../../../crates/share" }
# TLS provider installed by `mmf_runtime_adapters::ensure_tls_provider`.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
# In-app updates (ADR-0001). Desktop-only feature; this app has no mobile
# target, so the dependency is unconditional.
tauri-plugin-updater = "2"
# Timers for the updater's background schedule (already in the tree via
# tauri/reqwest; named here so the "time" feature is guaranteed present).
tokio = { version = "1", features = ["time"] }
