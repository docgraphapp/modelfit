[package]
name = "modelfit-desktop"
version.workspace = true
edition.workspace = true

[lib]
name = "modelfit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
log = "0.4"
modelfit-hardware = { path = "../../../crates/hardware" }
modelfit-registry = { path = "../../../crates/registry" }
modelfit-recommendation = { path = "../../../crates/recommendation" }
modelfit-runtime-adapters = { path = "../../../crates/runtime-adapters" }
modelfit-share = { path = "../../../crates/share" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
