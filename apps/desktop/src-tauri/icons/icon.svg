<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#10b981" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0.1" y1="0.9" x2="0.85" y2="0.15">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="0.6" stop-color="#10b981"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="needle" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e5e5e5"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="64" y="64" width="896" height="896" rx="202"/>
    </clipPath>
  </defs>

  <!-- background tile -->
  <g clip-path="url(#squircle)">
    <rect x="64" y="64" width="896" height="896" fill="url(#bg)"/>
    <rect x="64" y="64" width="896" height="896" fill="url(#glow)"/>
  </g>

  <!-- soft glow at arc tip (under the arcs) -->
  <circle cx="756.7" cy="430.9" r="88" fill="#4ade80" opacity="0.18"/>

  <!-- gauge track -->
  <path d="M 278.2 680 A 270 270 0 1 1 745.8 680"
        fill="none" stroke="#333338" stroke-width="66" stroke-linecap="round"/>

  <!-- progress arc: measured fit, running hot into the green -->
  <path d="M 278.2 680 A 270 270 0 1 1 756.7 430.9"
        fill="none" stroke="url(#arc)" stroke-width="66" stroke-linecap="round"/>

  <!-- needle pointing at the sweet spot -->
  <path d="M 731 445 L 492 580 A 40 40 0 0 1 529 512 Z" fill="url(#needle)"/>

  <!-- hub -->
  <circle cx="512" cy="545" r="58" fill="#0c0c0e"/>
  <circle cx="512" cy="545" r="58" fill="none" stroke="#10b981" stroke-width="22"/>
  <circle cx="512" cy="545" r="16" fill="#4ade80"/>

  <!-- tick marks -->
  <g stroke="#52525b" stroke-width="14" stroke-linecap="round">
    <line x1="298.5" y1="668.3" x2="333.1" y2="648.3"/>
    <line x1="512" y1="251" x2="512" y2="291"/>
    <line x1="725.5" y1="668.3" x2="690.9" y2="648.3"/>
  </g>
</svg>
