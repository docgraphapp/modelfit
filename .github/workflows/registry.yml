name: Update model registry

on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # The `secrets` context is not available in a step-level `if:`, so tokens
    # are lifted to job env and the steps that need them gate on that instead.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MODELFIT_WEB_TOKEN: ${{ secrets.MODELFIT_WEB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build registry from Hugging Face
        run: |
          pip install pyyaml
          python3 registry-pipeline/build.py

      - name: Commit updated snapshot
        run: |
          git config user.name "modelfit-registry-bot"
          git config user.email "noreply@docgraph.app"
          if ! git diff --quiet registry/registry.json; then
            git add registry/registry.json
            git commit -m "registry: automated update $(date -u +%F)"
            git push
          else
            echo "registry unchanged"
          fi

      # A Pages deploy REPLACES the whole site, and the website shares this
      # project with the registry — so build-site.sh publishes both together.
      # Deploying the registry alone would take modelfit.docgraph.app down.
      # The website lives in the private docgraphapp/modelfit-web repo;
      # MODELFIT_WEB_TOKEN must be a PAT with read access to it.
      # Everything below is the SITE half of the deploy, and it needs a token
      # for the private website repo. Refreshing the registry is this job's
      # actual purpose and must not fail because the site half is unavailable:
      # the committed snapshot still reaches users through the app's GitHub
      # mirror, and the site ships by local wrangler when there are no secrets.
      - name: Check out website
        if: env.MODELFIT_WEB_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: docgraphapp/modelfit-web
          token: ${{ env.MODELFIT_WEB_TOKEN }}
          path: website

      # The app's hover cards deep-link into section ids across the blog posts.
      # Fail here rather than shipping a site where "Learn more" lands nowhere.
      - name: Check glossary anchors
        if: env.MODELFIT_WEB_TOKEN != ''
        run: python3 scripts/check-glossary-anchors.py

      # /glossary/ is generated from glossary.ts at deploy time. Fail if the
      # copy committed to the website repo was edited by hand — that edit would
      # be silently discarded, which is worse than a red build.
      - name: Check glossary page is generated, not authored
        if: env.MODELFIT_WEB_TOKEN != ''
        run: python3 scripts/build-glossary-page.py --check website/glossary/index.html

      - name: Deploy site + registry to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.MODELFIT_WEB_TOKEN != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: a407f54bd034ac91d08e953368b3aa12
        run: |
          ./scripts/build-site.sh dist-site
          npx wrangler@4 pages deploy dist-site --project-name modelfit-registry --branch main --commit-dirty=true
