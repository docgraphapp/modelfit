name: Update model registry

on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build registry from Hugging Face
        run: |
          pip install pyyaml
          python3 registry-pipeline/build.py

      - name: Commit updated snapshot
        run: |
          git config user.name "modelfit-registry-bot"
          git config user.email "noreply@docgraph.app"
          if ! git diff --quiet registry/registry.json; then
            git add registry/registry.json
            git commit -m "registry: automated update $(date -u +%F)"
            git push
          else
            echo "registry unchanged"
          fi

      # A Pages deploy REPLACES the whole site, and the website shares this
      # project with the registry — so build-site.sh publishes both together.
      # Deploying the registry alone would take modelfit.docgraph.app down.
      # The website lives in the private docgraphapp/modelfit-web repo;
      # MODELFIT_WEB_TOKEN must be a PAT with read access to it.
      - name: Check out website
        uses: actions/checkout@v4
        with:
          repository: docgraphapp/modelfit-web
          token: ${{ secrets.MODELFIT_WEB_TOKEN }}
          path: website

      # The app's hover cards deep-link into the fundamentals post. Fail here
      # rather than shipping a site where "Learn more" lands nowhere.
      - name: Check glossary anchors
        run: python3 scripts/check-glossary-anchors.py

      - name: Deploy site + registry to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a407f54bd034ac91d08e953368b3aa12
        run: |
          ./scripts/build-site.sh dist-site
          npx wrangler@4 pages deploy dist-site --project-name modelfit-registry --branch main --commit-dirty=true
