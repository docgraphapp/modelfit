name: Update model registry

on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build registry from Hugging Face
        run: |
          pip install pyyaml
          python3 registry-pipeline/build.py

      - name: Commit updated snapshot
        run: |
          git config user.name "modelfit-registry-bot"
          git config user.email "noreply@docgraph.app"
          if ! git diff --quiet registry/registry.json; then
            git add registry/registry.json
            git commit -m "registry: automated update $(date -u +%F)"
            git push
          else
            echo "registry unchanged"
          fi

      - name: Deploy to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a407f54bd034ac91d08e953368b3aa12
        run: |
          mkdir -p deploy/registry/v1
          cp registry/registry.json deploy/registry/v1/registry.json
          printf '/registry/*\n  Cache-Control: public, max-age=300\n  Access-Control-Allow-Origin: *\n' > deploy/_headers
          npx wrangler@4 pages deploy deploy --project-name modelfit-registry --branch main --commit-dirty=true
