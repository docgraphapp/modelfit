[workspace]
resolver = "2"
members = ["crates/hardware", "crates/registry", "crates/recommendation", "crates/runtime-adapters", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"

[profile.release]
strip = true
lto = true
