  name: Llama 3.2 3B
  family: llama
  parameters_b: 3.2
  max_context: 131072
  capabilities: [chat]
  quality: { general: 6.6, coding: 6.0 }
  ollama_tag: llama3.2:3b
  hf_repo: bartowski/Llama-3.2-3B-Instruct-GGUF
  quants:
    Q4_K_M: { fallback_size_gb: 2.0 }
    Q8_0: { fallback_size_gb: 3.4 }
