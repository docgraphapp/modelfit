# ModelFit registry source of truth.
#
# The pipeline (build.py) enriches each entry from Hugging Face:
#   - exact quant file sizes from the GGUF repo file listing
#   - KV-cache cost per 1k context computed from GGUF header metadata
#     (n_layers × 2 × n_kv_heads × head_dim × 2 bytes)
# The `fallback` values below are used when HF is unreachable or a repo
# moves, so the build always produces a complete registry.
#
# Curated by hand (deliberately): quality scores, capabilities, ollama tags.

